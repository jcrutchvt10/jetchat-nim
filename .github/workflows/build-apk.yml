name: Build Android 17 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android 17 Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Node Dependencies (With Linux Bindings)
        run: |
          npm install --include=optional --os=linux --cpu=x64

      - name: Build Web Application
        run: |
          npx vite build
          npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor Native Project
        run: npx cap sync android

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set Permissions for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compile Real APK (Debug Release Asset)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Compiled Android 17 App Binary
        uses: actions/upload-artifact@v4
        with:
          name: jetchat-android-17-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
