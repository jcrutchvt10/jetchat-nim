name: Build Android 17 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android 17 Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --include=optional

      - name: Force Tailwind Linux Native Binary
        run: npm install @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Build Web Application
        run: |
          npx vite build
          npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor Native Project
        run: npx cap sync android

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # --- FIXED: Use a transient clean installation of Gradle to regenerate a fresh local wrapper ---
      - name: Purge and Regenerate Fresh Gradle Wrapper
        run: |
          cd android
          rm -f gradle/wrapper/gradle-wrapper.jar
          
          # Download a clean binary package to a temporary workspace directory
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle-tmp.zip
          unzip -q gradle-tmp.zip -d gradle-tmp-extracted
          
          # Use that fresh temporary global binary to regenerate your local project wrapper config cleanly
          ./gradle-tmp-extracted/gradle-8.2/bin/gradle wrapper
          
          # Clean up the installation artifacts from the runner workspace
          rm -rf gradle-tmp.zip gradle-tmp-extracted

      - name: Set Permissions for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compile Real APK (Debug Release Asset)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Compiled Android 17 App Binary
        uses: actions/upload-artifact@v4
        with:
          name: jetchat-android-17-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
